<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf8" />
        <title>Mail Infinite</title>
        <link href="../includes/bootstrap.css" rel="stylesheet" />
        <script src="../includes/jquery.js"></script>
        <script src="../includes/logs.js"></script>
        <script src="../includes/bootstrap.js"></script>
        <script src="popup.js"></script>
        <script src="footprints.js"></script>
        <script src="query.js"></script>
        <script src="runner.js"></script>
        <style>
            body {
                width: 780px;
                transition: background-color 0.3s, color 0.3s;
            }
            body.dark-theme {
                background-color: #121212;
                color: #e0e0e0;
            }
            body.dark-theme .glass-card, 
            body.dark-theme .container-fluid {
                background-color: #121212;
            }
            body.dark-theme .form-control {
                background-color: #1e1e1e;
                border-color: #333;
                color: #e0e0e0;
            }
            body.dark-theme .input-group-addon {
                background-color: #2c2c2c;
                border-color: #333;
                color: #e0e0e0;
            }
            body.dark-theme h3, 
            body.dark-theme h4,
            body.dark-theme label {
                color: #e0e0e0;
            }
            body.dark-theme .text-info {
                color: #81d4fa;
            }
            body.dark-theme .text-muted {
                color: #9e9e9e;
            }
            body.dark-theme .btn-default {
                background-color: #2c2c2c;
                border-color: #444;
                color: #e0e0e0;
            }
            body.dark-theme .btn-default:hover {
                background-color: #3d3d3d;
            }
            #theme-toggle {
                cursor: pointer;
                font-size: 20px;
                transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1), color 0.3s;
                color: #f39c12; /* Sun color */
                display: inline-block;
                padding: 8px;
                border-radius: 50%;
                background: rgba(0,0,0,0.03);
            }
            #theme-toggle:hover {
                transform: rotate(30deg) scale(1.1);
                background: rgba(0,0,0,0.06);
            }
            body.dark-theme #theme-toggle {
                color: #f1c40f; /* Moon color */
                transform: rotate(360deg);
                background: rgba(255,255,255,0.1);
            }
            /* Hide moon icon in light mode, sun in dark mode */
            .mode-moon { display: none; }
            body.dark-theme .mode-sun { display: none; }
            body.dark-theme .mode-moon { display: inline-block; }
        </style>
    </head>
    <body>
        <div class="container-fluid">
            <div class="row" style="padding-top: 15px; padding-bottom: 15px;">
                <div class="col-sm-3 text-center" style="padding: 10px 0;">
                    <p class="text-info">
                        MailInfinite.com 
                        <span class="text-primary">
                            VER <span id="version"></span>
                        </span>
                    </p>
                </div>
                <div class="col-sm-6 text-center">
                    <img src="../logo/logo.png" alt="Mail Infinite Logo" style="height: 40px; vertical-align: middle;">
                    <div id="theme-toggle" title="Toggle Theme" style="vertical-align: middle; margin-left: 15px;">
                        <i class="glyphicon glyphicon-certificate mode-sun"></i>
                        <i class="glyphicon glyphicon-record mode-moon"></i>
                    </div>
                </div>
                <div class="col-sm-3 text-center">
                </div>
            </div>
            <div class="row">
                <div class="col-sm-4">
                    <div class="form-group">
                        <label for="cse-address-input" style="line-height: 32px;">Insert Your CSE Main Address</label>
                    </div>
                </div>
                <div class="col-sm-8">
                    <div class="form-group">
                        <input class="form-control" id="cse-address-input" placeholder="https://cse.google.com/">
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-sm-6">
                    <div class="form-group">
                        <label for="footprints-input">Site footprint</label>
                        <textarea style="resize: none;" rows="3" class="form-control" id="footprint-input"></textarea>
                    </div>
                </div>
                <div class="col-sm-3">
                    <div class="form-group">
                        <label for="pattern-input">@ Patterns</label>
                        <textarea style="resize: none;" class="form-control" rows="3" id="pattern-input"></textarea>
                    </div>
                </div>
                <div class="col-sm-3">
                    <div class="form-group">
                        <label for="location-input">Location</label>
                        <textarea style="resize: none;" class="form-control" rows="3" id="location-input"></textarea>
                    </div>
                </div>
            </div>
            <div class="row text-center" id="runner-status" style="display: none; padding-bottom: 10px;">
                <h4>Now running : <span class="text-primary" id="current-query-string"></span></h4>
            </div>
            <div class="row" style="padding-bottom: 20px;">
                <div class="col-sm-5">
                    <p>
                        <h3>
                            <span class="text-muted">Collected : </span><span class="text-primary"><span id="collected-emails">0</span> emails</span>
                        </h3>
                        <h3 id="progress-running">
                            <span class="text-muted">Progress : </span><span class="text-primary"><span id="current-query">0</span>/<span id="total-queries">0</span> queries</span>
                        </h3>
                        <h3 id="progress-complete-indicator">
                            <span class="text-muted">Progress : </span><span class="text-success">Complete</span>
                        </h3>
                        <h3 id="progress-stopped-indicator">
                            <span class="text-muted">Progress : </span><span class="text-danger">Stopped</span>
                        </h3>
                    </p>
                </div>
                <div class="col-sm-6">
                    <div style="padding-top: 30px;">
                        <div class="row">
                            <div class="col-sm-6 text-center" style="padding: 0 10px;">
                                <button class="btn btn-primary btn-lg btn-block" id="toggle">START</button>
                            </div>
                            <div class="col-sm-6 text-center" style="padding: 0 10px;">
                                <button class="btn btn-primary btn-lg btn-block" id="download">DOWNLOAD</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row" style="padding-bottom: 10px;">
                <div class="container-fluid">
                    <div class="row">
                        <div class="col-sm-4">
                            <div class="form-group">
                                <label for="delayInput" style="padding-top: 5px;" class="col-sm-8 control-label">Delay (secs)</label>
                                <div class="col-sm-4">
                                    <input type="number" min="0" max="99" class="form-control" id="delayInput">
                                </div>
                            </div>
                        </div>
                        <div class="col-sm-4">
                            <div class="form-group">
                                <label for="dateAfterInput" style="padding-top: 5px;" class="col-sm-4 control-label">After</label>
                                <div class="col-sm-8">
                                    <input type="date" class="form-control" id="dateAfterInput">
                                </div>
                            </div>
                        </div>
                        <div class="col-sm-4">
                            <div class="checkbox" style="margin-bottom: -5px;">
                                <label>
                                    <input type="checkbox" checked id="removeDuplicates">
                                    <b>Remove duplicates</b>
                                </label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
