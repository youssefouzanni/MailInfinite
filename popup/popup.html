<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mail Infinite</title>
    <link href="../includes/bootstrap.css" rel="stylesheet" />
    <script src="../includes/jquery.js"></script>
    <script src="../includes/logs.js"></script>
    <script src="../includes/bootstrap.js"></script>
    <script src="popup.js"></script>
    <script src="footprints.js"></script>
    <script src="query.js"></script>
    <script src="runner.js"></script>
    <style>
        :root {
            --bg: #FFFFFF; --card-bg: #F9FAFB; --border: #E5E7EB; --text: #111827;
            --primary: #2563EB; --success: #059669; --danger: #DC2626;
            --font: 'Inter', system-ui, sans-serif;
        }
        body.dark-theme {
            --bg: #111827; --card-bg: #1F2937; --border: #374151; --text: #F9FAFB;
        }
        body { width: 520px; margin: 0; padding: 12px; background-color: var(--bg); color: var(--text); font-family: var(--font); font-size: 12px; }
        
        /* Layout */
        .container { display: flex; flex-direction: column; gap: 10px; }
        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 10px; }
        
        /* Header */
        header { display: flex; align-items: center; justify-content: space-between; padding-bottom: 5px; }
        .brand { display: flex; align-items: center; gap: 8px; }
        
        /* Theme Switch */
        #theme-toggle { cursor: pointer; width: 40px; height: 40px; border-radius: 20px; background: var(--border); display: flex; align-items: center; justify-content: center; transition: background 0.2s; }
        .mode-moon { display: none; }
        body.dark-theme .mode-sun { display: none; }
        body.dark-theme .mode-moon { display: inline-block; }
        
        /* Compact Inputs */
        .form-group { margin-bottom: 8px; }
        label { font-weight: 600; margin-bottom: 2px; display: block; }
        .form-control { height: 32px; padding: 4px 8px; border-radius: 6px; font-size: 12px; }
        textarea.form-control { height: 48px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
        
        /* Stats & Settings */
        .stats-row { display: flex; justify-content: space-between; align-items: center; }
        .stat-val { font-size: 16px; font-weight: 700; color: var(--primary); }
        .settings-row { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; align-items: end; }
        
        /* Actions */
        .action-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
        .btn { height: 42px; border-radius: 10px; font-weight: 600; font-size: 13px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="brand">
                <img src="../logo/logo.png" style="height: 28px;">
                <div>
                    <h1 style="font-size: 16px; margin: 0;">MailInfinite</h1>
                    <span style="font-size: 10px; opacity: 0.7;">VER <span id="version"></span></span>
                </div>
            </div>
            <div id="theme-toggle" title="Toggle Theme">
                <i class="glyphicon glyphicon-certificate mode-sun"></i>
                <i class="glyphicon glyphicon-record mode-moon"></i>
            </div>
        </header>

        <section class="card" id="search-settings">
            <div class="form-group">
                <label for="cse-address-input">Google CSE URL</label>
                <input class="form-control" id="cse-address-input" placeholder="https://cse.google.com/">
            </div>
            <div class="grid-3">
                <div class="form-group"><label for="footprint-input">Keyword</label><textarea class="form-control" id="footprint-input"></textarea></div>
                <div class="form-group"><label for="pattern-input">Pattern</label><textarea class="form-control" id="pattern-input"></textarea></div>
                <div class="form-group"><label for="location-input">Country</label><textarea class="form-control" id="location-input"></textarea></div>
            </div>
        </section>

        <section class="card" id="statistics">
            <div id="runner-status" style="display: none; margin-bottom: 5px;">
                <h4 style="font-size: 12px;">Running: <span id="current-query-string"></span></h4>
            </div>
            <div class="stats-row">
                <div><label>Emails</label><div class="stat-val" id="collected-emails">0</div></div>
                <div><label>Progress</label>
                    <div class="stat-val" id="progress-running"><span id="current-query">0</span>/<span id="total-queries">0</span></div>
                    <div class="stat-val" id="progress-complete-indicator" style="display: none; color: var(--success);">Complete</div>
                    <div class="stat-val" id="progress-stopped-indicator" style="display: none; color: var(--danger);">Stopped</div>
                </div>
            </div>
        </section>

        <section class="card" id="settings">
            <div class="settings-row">
                <div class="form-group"><label for="delayInput">Delay</label><input type="number" class="form-control" id="delayInput"></div>
                <div class="form-group"><label for="dateAfterInput">After</label><input type="date" class="form-control" id="dateAfterInput"></div>
                <div class="checkbox"><label><input type="checkbox" checked id="removeDuplicates"> Unique</label></div>
            </div>
        </section>

        <div class="action-row">
            <button class="btn btn-primary" id="toggle">▶ START</button>
            <button class="btn btn-primary" id="download">⬇ CSV</button>
            <button class="btn btn-success" id="extract-page">🌐 PAGE</button>
        </div>
    </div>
</body>
</html>
